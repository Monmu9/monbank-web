



<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Login - Banca Simulada MONBANK</title>
	<link rel="stylesheet" href="css/style.css">
</head>


<body>
	<header>
		<h1>Acceso a Banca Simulada</h1>
	</header>
	
	<section>
		<form id="loginForm">
			<label for="usuario">Usuario: </label><br>
			<input type="text" id="usuario" required><br><br>
			
			<label for="clave">Contraseña: </label>
			<input type="password" id="clave" required><br><br>
			
			<button type="submit">Entrar</button>
		</form>
		
		
		
		<p style="margin-top: 20px; font-size: 14px; color: #555;">
  			¿No tienes cuenta? Puedes acceder a una versión demo sin registro.
		</p>
		

		<button id="demoBtn" type="button"
 		 style="margin-top: 10px; background-color: #43a047; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer;">
  			Accede a la Demo 🚀
		</button>
		
		
		
		<p id="mensaje"></p>
	</section>
	
	
	
	 <script src="js/login.js"></script>
	 
	 
	 <script> <!--Este es el script para activar el botón demo-->
        document.getElementById("demoBtn").addEventListener("click", function () {
            localStorage.setItem("usuarioLogueado", "demoUser");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
